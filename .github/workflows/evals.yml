# Evals for the Claude Code harness (evals/) — skills, subagents and workflow-level behavior.
#
# Three independent tiers, gated by WHAT changed in the PR. Detection itself is NOT hand-rolled
# here — it reuses evals/scripts/ci-detect.mjs, which ships with the evals/ lesson package and
# already does this exact job: maps changed files onto skill/agent names, checks each one for an
# actual evals/<tier>/<name>/*.eval.ts (not just a path guess), and reports the rest on its
# skipped_skills/skipped_agents outputs instead of silently doing nothing. We extended its
# run_workflow detection by one clause (see the diff in ci-detect.mjs) to also catch a
# package-local AGENTS.md, not just the root one — CLAUDE.md is a symlink to AGENTS.md
# (AGENTS.md: "Edit tools refuse to write through a symlink"), so AGENTS.md is what actually
# changes on disk in every package, not only at the repo root.
#
#   a changed .claude/skills/<name>/**  -> run evals/skills/<name>  (content tier, if it has evals)
#   a changed .claude/agents/<name>.md  -> run evals/agents/<name>  (tool tier, if it has evals —
#                                          needs the LiteLLM proxy, agentTask runs on the SDK)
#   a changed **/AGENTS.md              -> run the full workflow tier (tool tier, needs the proxy
#                                          too — dispatch/activation assertions)
# A changed skill/agent with NO evals/<tier>/<name> is NOT a failure — ci-detect.mjs puts it on
# skipped_skills/skipped_agents, which we print to the job summary instead of running anything for
# it. See evals/README.md "Which change -> which run" and "Wiring into GitHub Actions (per-PR)".
#
# Models: all three tiers run on google/gemini-2.5-flash. DeepSeek was tried first for the
# skill/agent tiers (cheaper) but dropped after a real test PR (#11) showed it missing
# judge-threshold/grounding checks on different cases across repeated runs — e.g. writing a valid
# but differently-shaped Mermaid block (`graph TD` vs the case's required `flowchart`), or not
# naming a finding's rule identifier verbatim. README's own measurement already found Gemini Flash
# the only model that reliably handles the *tool* tiers (subagent dispatch); this is the same
# capability gap showing up on the content tier too, so one model everywhere is both simpler and
# more stable than two.
#
# workflow-evals is intentionally not a required check: activation-kind cases are indicative-only
# on non-Anthropic models (README: a capable model may act directly instead of invoking the Skill
# tool, which the assertion counts as a miss even though the behavior is fine).
name: evals

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '**/AGENTS.md'
      - 'evals/**'
  pull_request:
    paths:
      - '.claude/skills/**'
      - '.claude/agents/**'
      - '**/AGENTS.md'
      - 'evals/**'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect changed targets
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.detect.outputs.skills }}
      agents: ${{ steps.detect.outputs.agents }}
      workflow_changed: ${{ steps.detect.outputs.run_workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: collect changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # First push to a new branch / shallow history: fall back to the previous commit.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          git diff --name-only "$base" "${{ github.sha }}" > /tmp/eval-changed.txt

      - id: detect
        name: map changes to evals
        run: |
          CHANGED_FILES="$(cat /tmp/eval-changed.txt)"
          export CHANGED_FILES
          node evals/scripts/ci-detect.mjs

      - name: publish detection summary
        env:
          # Same reasoning as the matrix jobs: these are derived from PR-controlled folder names
          # (ci-detect.mjs regex-extracts them from the changed-files list) — go through env, not
          # a direct ${{ }} splice into the script, which would let shell metacharacters in a
          # crafted skill/agent folder name execute as code on checkout.
          SKILLS: ${{ steps.detect.outputs.skills }}
          AGENTS: ${{ steps.detect.outputs.agents }}
          RUN_WORKFLOW: ${{ steps.detect.outputs.run_workflow }}
          SKIPPED_SKILLS: ${{ steps.detect.outputs.skipped_skills }}
          SKIPPED_AGENTS: ${{ steps.detect.outputs.skipped_agents }}
        run: |
          {
            echo "## Eval scope"
            echo ""
            echo "- skills to run: \`$SKILLS\`"
            echo "- agents to run: \`$AGENTS\`"
            echo "- workflow tier: \`$RUN_WORKFLOW\`"
            if [ -n "$SKIPPED_SKILLS" ]; then
              echo "- skipped skills (no evals written yet): \`$SKIPPED_SKILLS\`"
            fi
            if [ -n "$SKIPPED_AGENTS" ]; then
              echo "- skipped agents (no evals written yet): \`$SKIPPED_AGENTS\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  skill-evals:
    name: skill evals (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.skills != '[]'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.detect.outputs.skills) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      EVAL_BACKEND: openrouter
      EVAL_MODEL: google/gemini-2.5-flash
      EVAL_JUDGE_MODEL: google/gemini-2.5-flash
      # Pass the matrix value through env, never interpolate ${{ matrix.name }} directly into a
      # run: script — it is a directory name taken from PR content (ci-detect.mjs regex-extracts
      # it from the changed-files list), so an attacker-chosen folder name containing shell
      # metacharacters would otherwise be spliced into the script as code before bash even runs,
      # on a trigger that (for same-repo PRs) has OPENROUTER_API_KEY in scope.
      SKILL_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: guard missing secret
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::warning::OPENROUTER_API_KEY is empty (likely a fork PR without secret access) — skipping skill-evals for $SKILL_NAME"
          exit 0

      # ci-detect.mjs already confirmed this skill has evals/<name>/*.eval.ts before putting it
      # in the matrix — no "does it exist" check needed here.
      - name: run
        if: env.OPENROUTER_API_KEY != ''
        run: pnpm vitest run "skills/$SKILL_NAME"

  agent-evals:
    name: agent evals (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.agents != '[]'
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.detect.outputs.agents) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: http://localhost:4000
      EVAL_BACKEND: openrouter
      EVAL_MODEL: google/gemini-2.5-flash
      EVAL_JUDGE_MODEL: google/gemini-2.5-flash
      # See the same env-not-interpolation note in skill-evals above.
      AGENT_NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: guard missing secret
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::warning::OPENROUTER_API_KEY is empty (likely a fork PR without secret access) — skipping agent-evals for $AGENT_NAME"
          exit 0

      - name: start proxy
        if: env.OPENROUTER_API_KEY != ''
        run: docker compose -f proxy/docker-compose.yml up -d

      - name: wait for proxy
        if: env.OPENROUTER_API_KEY != ''
        run: pnpm proxy:wait

      - name: run
        if: env.OPENROUTER_API_KEY != ''
        run: pnpm vitest run "agents/$AGENT_NAME"

      - name: proxy logs on failure
        if: failure() && env.OPENROUTER_API_KEY != ''
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - name: stop proxy
        if: always() && env.OPENROUTER_API_KEY != ''
        run: docker compose -f proxy/docker-compose.yml down

  workflow-evals:
    name: workflow evals
    needs: detect
    if: needs.detect.outputs.workflow_changed == 'true'
    continue-on-error: true   # indicative-only on non-Anthropic models — see header comment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: http://localhost:4000
      EVAL_BACKEND: openrouter
      EVAL_MODEL: google/gemini-2.5-flash
      EVAL_JUDGE_MODEL: google/gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

      - name: guard missing secret
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "::warning::OPENROUTER_API_KEY is empty (likely a fork PR without secret access) — skipping workflow-evals"
          exit 0

      - name: start proxy
        if: env.OPENROUTER_API_KEY != ''
        run: docker compose -f proxy/docker-compose.yml up -d

      - name: wait for proxy
        if: env.OPENROUTER_API_KEY != ''
        run: pnpm proxy:wait

      - name: run
        if: env.OPENROUTER_API_KEY != ''
        run: pnpm eval:workflow

      - name: proxy logs on failure
        if: failure() && env.OPENROUTER_API_KEY != ''
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - name: stop proxy
        if: always() && env.OPENROUTER_API_KEY != ''
        run: docker compose -f proxy/docker-compose.yml down
