name: DevDigest Review
on:
  pull_request:
    types:
      - opened
      - synchronize
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    # Skipped (never started) for fork PRs and for PRs too large to review in one pass.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.additions <= 5000 &&
      github.event.pull_request.deletions <= 5000 &&
      github.event.pull_request.changed_files <= 100
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: DevDigest review
        run: node .devdigest/runner/index.js
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEVDIGEST_POST_AS: pr_comment
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: ignore
